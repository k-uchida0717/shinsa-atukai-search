name: 支払基金・国保データ自動更新

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 06:00 JST
  workflow_dispatch:        # 手動実行も可能
    inputs:
      force:
        description: "変更がなくても国保データを取り込み直す"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 支払基金（公開Excel → 整合性チェック → JSON）
        id: ssk
        continue-on-error: true
        run: python scripts/update_data.py
      - name: 国保中央会（一覧HTML＋PDF → 整合性チェック → JSON）
        id: kokuho
        continue-on-error: true
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
        run: python scripts/update_kokuho.py
      - name: 支払基金と国保の共通事例を突き合わせ（まとめ表示用）
        run: python scripts/match_pairs.py
      - name: 変更があればコミット
        run: |
          if git diff --quiet -- data/; then
            echo "データに変更なし"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "データ自動更新 $(date -u -d '+9 hours' '+%Y-%m-%d')"
            git push
          fi
      - name: 取得・整合性チェックに失敗した場合はジョブを失敗にする（メール通知用）
        if: steps.ssk.outcome == 'failure' || steps.kokuho.outcome == 'failure'
        run: |
          echo "支払基金: ${{ steps.ssk.outcome }} / 国保中央会: ${{ steps.kokuho.outcome }}"
          exit 1
